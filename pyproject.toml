[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-model-routing"
dynamic = ["version"]
description = "Route every repeated kind of model call, from ticket triage to eval and judge calls, to the cheapest model that clears a measured quality bar (or the best one, cost-blind), with fallback, monitoring and cost attribution."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "jeffma8888" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]
# Only the evidence converters under evidence/ need these; the package never imports them.
evidence = ["pandas>=2,<3"]

[project.scripts]
model-routing = "model_routing.cli:main"

[tool.setuptools.packages.find]
include = ["model_routing*"]

[tool.setuptools.package-data]
model_routing = ["data/*.json", "py.typed"]

[tool.setuptools.dynamic]
# One version source: model_routing/__init__.py `__version__`, read from the source, not imported.
version = { attr = "model_routing.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
