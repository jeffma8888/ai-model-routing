[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-model-routing"
version = "0.1.0"
description = "Route every eval and judge call to the cheapest model that clears a measured quality bar (or the best one, cost-blind), with fallback, monitoring and cost attribution."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "jeffma8888" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
model-routing = "model_routing.cli:main"

[tool.setuptools.packages.find]
include = ["model_routing*"]

[tool.setuptools.package-data]
model_routing = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
